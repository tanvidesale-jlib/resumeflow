services:
  - type: web
    name: resumeflow-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: resumeflow-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://tanvidesale-jlib.github.io/resumeflow
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false

databases:
  - name: resumeflow-db
    databaseName: resumeflow
    user: resumeflow
    region: singapore
    plan: free
